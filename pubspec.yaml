name: antinote_app
description: "La solution !"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter

  hugeicons_pro: ^0.0.3
  intl: ^0.20.2
  pigeon: ^26.3.4
  protobuf: ^6.0.0

  antinote:
    git: https://github.com/ANTINOTE-project/antinote.git
  rrule: ^0.2.18
  shared_preferences: ^2.5.5
  go_router: ^17.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true

  fonts:
    - family: SNPro
      fonts:
        - asset: assets/fonts/SNPro-Light.ttf
          weight: 300
        - asset: assets/fonts/SNPro-Regular.ttf
          weight: 400
        - asset: assets/fonts/SNPro-Medium.ttf
          weight: 500
        - asset: assets/fonts/SNPro-Semibold.ttf
          weight: 600
        - asset: assets/fonts/SNPro-Bold.ttf
          weight: 700
        - asset: assets/fonts/SNPro-Black.ttf
          weight: 800
