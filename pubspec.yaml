name: antinote_app
description: "La solution !"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter

  hugeicons_pro: ^0.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_localizations:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  fonts:
    - family: SNPro
      fonts:
        - asset: assets/fonts/SNPro-Light.ttf
          weight: 300
        - asset: assets/fonts/SNPro-Regular.ttf
          weight: 400
        - asset: assets/fonts/SNPro-Medium.ttf
          weight: 500
        - asset: assets/fonts/SNPro-Semibold.ttf
          weight: 600
        - asset: assets/fonts/SNPro-Bold.ttf
          weight: 700
        - asset: assets/fonts/SNPro-Black.ttf
          weight: 800
